<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="VeriFact detects fact-conflicting hallucinations in large language models using MetaQA metamorphic verification."
    />
    <script>
      (function () {
        try {
          var key = 'verifact-theme'
          var preference = localStorage.getItem(key) || 'system'
          if (preference !== 'light' && preference !== 'dark' && preference !== 'system') {
            preference = 'system'
          }
          var resolved =
            preference === 'system'
              ? window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light'
              : preference
          document.documentElement.setAttribute('data-theme', resolved)
          document.documentElement.setAttribute('data-theme-preference', preference)
          document.documentElement.style.colorScheme = resolved
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'light')
        }
      })()
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,400;0,14..32,500;0,14..32,600;0,14..32,700;1,14..32,400&display=swap"
      rel="stylesheet"
    />
    <title>VeriFact — Hallucination Detection</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
