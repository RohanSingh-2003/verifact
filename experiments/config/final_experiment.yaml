dataset:
  name: pilot
  version: "1.0"
  path: backend/data/datasets/pilot.json
  manifest: backend/data/datasets/pilot.manifest.json
  source: Hand-selected factual questions. Not TruthfulQA.
  license: Original curated items for VeriFact research.
  number_of_questions: 40
  ground_truth_in_detector: false

models:
  generator_a: gpt-4o-mini
  generator_b: gpt-4o
  verifier_a: gpt-4o-mini
  verifier_b: gpt-4o
  provider: openai_compatible

generation:
  temperature: 0.0
  max_output_tokens: 800
  timeout_seconds: 60
  max_retries: 2
  retry_backoff: exponential
  verify_concurrency: 5
  seed: null
  seed_note: Hosted LLM APIs do not expose a usable seed. Live runs are not bit-reproducible.

metaqa:
  synonym_count: 5
  antonym_count: 5
  mutation_count: 10
  threshold: 0.5
  prompt_bundle: metaqa-v1
  answer_prompt: answer-v1
  mutation_prompt: mutation-v1
  verify_prompt: verify-v1

experiment_design:
  conditions:
    - A_to_A
    - A_to_B
    - B_to_A
    - B_to_B
  fixed_mutation_reuse: true
  trials: 1
  alpha: 0.05
  primary_test: wilcoxon_signed_rank
  production_threshold_locked: 0.5
  sweep_thresholds: [0.30, 0.35, 0.40, 0.45, 0.50, 0.55, 0.60, 0.65, 0.70]

cost:
  estimated_calls_per_question: 44
  estimated_2x2_calls: 1760
  estimated_evaluation_calls_one_detector: 480
  confirm_required: true

runtime_at_freeze:
  llm_mode: mock
  live_ready: false
  api_key_configured: false
